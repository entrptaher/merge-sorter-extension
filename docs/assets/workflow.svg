<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 132" role="img" aria-labelledby="title description">
  <title id="title">Three manual steps</title>
  <desc id="description">Choose scope, choose an action after you review counts and selections, then review the result and warnings.</desc>
  <rect width="960" height="132" rx="12" fill="#f0f4f5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <g fill="#21533e">
      <circle cx="45" cy="49" r="17"/>
      <circle cx="365" cy="49" r="17"/>
      <circle cx="685" cy="49" r="17"/>
    </g>
    <g fill="#f0f4f5" font-size="17" font-weight="600" text-anchor="middle">
      <text x="45" y="55">1</text>
      <text x="365" y="55">2</text>
      <text x="685" y="55">3</text>
    </g>
    <g fill="#173f30" font-size="22" font-weight="650">
      <text x="75" y="56">Choose scope</text>
      <text x="395" y="56">Choose action</text>
      <text x="715" y="56">Review result</text>
    </g>
    <g fill="#526861" font-size="16">
      <text x="28" y="96">This window or all windows</text>
      <text x="348" y="96">Review counts, then act</text>
      <text x="668" y="96">Read feedback and warnings</text>
    </g>
  </g>
  <g fill="none" stroke="#526861" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 51h22m-6-6 6 6-6 6"/>
    <path d="M606 51h22m-6-6 6 6-6 6"/>
  </g>
</svg>
